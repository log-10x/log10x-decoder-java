name: Publish Core to Maven Central

on:
  push:
    tags: ['v*-core']

jobs:
  publish:
    name: Build and Publish Core
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.2.3-core
          VERSION="${TAG#v}"                 # 1.2.3-core
          VERSION="${VERSION%-core}"         # 1.2.3
          echo "LOG10X_DECODER_CORE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: ./gradlew :log10x-decoder-core:clean :log10x-decoder-core:build

      - name: Publish to Maven Central
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :log10x-decoder-core:publishReleasePublicationToSonatypeRepository closeAndReleaseSonatypeStagingRepository --max-workers 1
